<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SJ monogram">
  <!-- Sun/leaf ring -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#0F8A6D" stroke-width="3"/>
  <!-- Sun rays (lower arc) -->
  <g stroke="#F2A05F" stroke-width="3" stroke-linecap="round">
    <line x1="17" y1="75" x2="12" y2="80"/>
    <line x1="32" y1="86" x2="29" y2="92"/>
    <line x1="48" y1="90" x2="48" y2="96"/>
    <line x1="64" y1="86" x2="67" y2="92"/>
    <line x1="79" y1="75" x2="84" y2="80"/>
  </g>
  <!-- Leaf on the ring, top-right -->
  <path d="M76 15 q12 0 12 12 q-12 0 -12 -12 Z" fill="#0F8A6D"/>
  <path d="M76 15 q6 6 12 12" fill="none" stroke="#F4F7F3" stroke-width="1.4"/>
  <!-- Monogram -->
  <text x="48" y="60" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="500" fill="#0F8A6D">SJ</text>
</svg>
